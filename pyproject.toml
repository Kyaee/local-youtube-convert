[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-downloader"
version = "0.1.0"
description = "Download YouTube media and generate local transcripts and summaries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.2.4",
]

[project.scripts]
youtube-downloader = "youtube_downloader.cli:main"

[dependency-groups]
dev = [
    "uv>=0.12.2",
    "pytest>=8.4",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "basedpyright>=1.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
pythonVersion = "3.14"
include = ["src"]
